<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGreenGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a1cb68" />
      <stop offset="100%" stop-color="#80af42" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="32" fill="url(#cardGreenGrad)" />
  <circle cx="480" cy="320" r="160" fill="white" fill-opacity="0.1" />

  <!-- Isometric Warehouse Boxes / Packaging -->
  <g transform="translate(180, 110)">
    <!-- Box 1 (Center bottom) -->
    <g transform="translate(80, 90)">
      <path d="M70 0 L140 35 L70 70 L0 35 Z" fill="#fdfefe" />
      <path d="M0 35 L70 70 L70 140 L0 105 Z" fill="#d9e7c5" />
      <path d="M70 70 L140 35 L140 105 L70 140 Z" fill="#ebf4dc" />
      <!-- Tape -->
      <path d="M50 25 L90 45" stroke="#a1cb68" stroke-width="8" />
    </g>

    <!-- Box 2 (Left back) -->
    <g transform="translate(0, 30)">
      <path d="M60 0 L120 30 L60 60 L0 30 Z" fill="#fdfefe" opacity="0.9" />
      <path d="M0 30 L60 60 L60 120 L0 90 Z" fill="#cfe0b5" />
      <path d="M60 60 L120 30 L120 90 L60 120 Z" fill="#e0edcb" />
    </g>

    <!-- Box 3 (Right back) -->
    <g transform="translate(150, 20)">
      <path d="M55 0 L110 28 L55 56 L0 28 Z" fill="#fdfefe" opacity="0.95" />
      <path d="M0 28 L55 56 L55 110 L0 82 Z" fill="#d4e4bc" />
      <path d="M55 56 L110 28 L110 82 L55 110 Z" fill="#e4f0d3" />
    </g>
  </g>

  <!-- Stock Badge Checkmark -->
  <g transform="translate(380, 70)">
    <circle cx="36" cy="36" r="36" fill="white" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.12))" />
    <circle cx="36" cy="36" r="28" fill="#a1cb68" />
    <path d="M25 36 L33 44 L47 28" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>