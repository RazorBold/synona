<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="meshKrem" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#fff8f2" />
      <stop offset="100%" stop-color="#fcede0" />
    </radialGradient>
    <radialGradient id="orbViolet" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#b3a7fb" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6d5df6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6d5df6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbBlue" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#71a7fd" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#71a7fd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCoral" cx="75%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#ea5d5b" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#fcede0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveLine" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d5df6" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#71a7fd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a1cb68" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#1e2235" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Base warm cream canvas -->
  <rect width="1920" height="1080" fill="url(#meshKrem)" />

  <!-- Ambient Light Orbs -->
  <rect width="1920" height="1080" fill="url(#orbViolet)" />
  <rect width="1920" height="1080" fill="url(#orbBlue)" />
  <rect width="1920" height="1080" fill="url(#orbCoral)" />

  <!-- Modern Subtle Dot Grid -->
  <rect width="1920" height="1080" fill="url(#dotGrid)" />

  <!-- Elegant Abstract Vector Ribbon / Waves -->
  <path d="M-100 450 C350 200, 750 680, 1250 350 C1650 100, 1850 480, 2100 320" stroke="url(#waveLine)" stroke-width="4" fill="none" />
  <path d="M-100 500 C380 250, 780 730, 1280 400 C1680 150, 1880 530, 2100 370" stroke="url(#waveLine)" stroke-width="1.5" stroke-dasharray="8 8" fill="none" />
  <path d="M-100 300 C450 650, 850 150, 1400 550 C1750 820, 1950 500, 2100 600" stroke="url(#waveLine)" stroke-width="2.5" fill="none" opacity="0.7" />

  <!-- Soft floating decorative modern badges -->
  <g transform="translate(1550, 180) rotate(12)" opacity="0.6">
    <rect width="160" height="70" rx="20" fill="white" fill-opacity="0.7" stroke="#edeff5" />
    <circle cx="35" cy="35" r="16" fill="#22c55e" fill-opacity="0.2" />
    <path d="M28 35 L33 40 L42 29" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="62" y="24" width="72" height="8" rx="4" fill="#1e2235" fill-opacity="0.4" />
    <rect x="62" y="38" width="48" height="6" rx="3" fill="#8a90a6" fill-opacity="0.4" />
  </g>

  <g transform="translate(180, 720) rotate(-8)" opacity="0.6">
    <rect width="180" height="80" rx="22" fill="white" fill-opacity="0.7" stroke="#edeff5" />
    <circle cx="40" cy="40" r="18" fill="#6d5df6" fill-opacity="0.2" />
    <path d="M32 44 L40 32 L48 40" stroke="#6d5df6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="70" y="28" width="80" height="9" rx="4" fill="#1e2235" fill-opacity="0.4" />
    <rect x="70" y="44" width="55" height="7" rx="3" fill="#8a90a6" fill-opacity="0.4" />
  </g>
</svg>