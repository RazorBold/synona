<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardRedGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea5d5b" />
      <stop offset="100%" stop-color="#cb3f3d" />
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="32" fill="url(#cardRedGrad)" />
  <circle cx="510" cy="110" r="150" fill="white" fill-opacity="0.08" />

  <!-- Glassmorphism Analytics Board -->
  <g transform="translate(110, 70)">
    <rect width="380" height="250" rx="20" fill="white" fill-opacity="0.95" filter="drop-shadow(0 16px 32px rgba(0,0,0,0.18))" />

    <!-- Top stats row -->
    <rect x="28" y="28" width="100" height="12" rx="6" fill="#1e2235" opacity="0.7" />
    <rect x="28" y="48" width="130" height="22" rx="6" fill="#ea5d5b" />

    <rect x="240" y="28" width="110" height="34" rx="10" fill="#fcede0" />
    <path d="M255 45 L265 37 L275 42 L287 32 M287 32 H277 M287 32 V42" stroke="#ea5d5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="296" y="38" width="40" height="8" rx="4" fill="#ea5d5b" />

    <!-- Chart grid & line -->
    <line x1="28" y1="110" x2="352" y2="110" stroke="#f1efff" stroke-width="1.5" />
    <line x1="28" y1="160" x2="352" y2="160" stroke="#f1efff" stroke-width="1.5" />
    <line x1="28" y1="210" x2="352" y2="210" stroke="#f1efff" stroke-width="1.5" />

    <!-- Area & Line Graph -->
    <path d="M30 190 Q90 180, 130 140 T230 110 T310 80 L350 70 L350 210 L30 210 Z" fill="url(#chartAreaGrad)" />
    <path d="M30 190 Q90 180, 130 140 T230 110 T310 80 L350 70" stroke="#ea5d5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pulsing data points -->
    <circle cx="130" cy="140" r="5" fill="#ea5d5b" stroke="white" stroke-width="2.5" />
    <circle cx="230" cy="110" r="5" fill="#ea5d5b" stroke="white" stroke-width="2.5" />
    <circle cx="310" cy="80" r="6" fill="#ea5d5b" stroke="white" stroke-width="3" />
  </g>
</svg>