<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBlueGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71a7fd" />
      <stop offset="100%" stop-color="#4a8ef7" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f5ff" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="32" fill="url(#cardBlueGrad)" />
  <!-- Watermark Circle -->
  <circle cx="500" cy="300" r="180" fill="white" fill-opacity="0.08" />

  <!-- Tablet / Cashier Register Display -->
  <g transform="translate(140, 60)">
    <!-- Stand -->
    <path d="M140 230 L180 230 L195 270 L125 270 Z" fill="#1e2235" opacity="0.3" />
    <rect x="100" y="268" width="120" height="14" rx="7" fill="#1e2235" opacity="0.4" />

    <!-- Tablet Body -->
    <rect x="20" y="20" width="280" height="190" rx="16" fill="#1e2235" />
    <rect x="32" y="32" width="256" height="166" rx="10" fill="url(#screenGrad)" />

    <!-- POS Header inside screen -->
    <rect x="46" y="46" width="80" height="14" rx="4" fill="#71a7fd" />
    <rect x="220" y="46" width="54" height="14" rx="4" fill="#22c55e" />

    <!-- Product Grid inside POS -->
    <rect x="46" y="72" width="68" height="52" rx="8" fill="#e2edfe" />
    <rect x="122" y="72" width="68" height="52" rx="8" fill="#e2edfe" />
    <rect x="46" y="132" width="68" height="52" rx="8" fill="#e2edfe" />
    <rect x="122" y="132" width="68" height="52" rx="8" fill="#e2edfe" />

    <!-- Cart Sidebar inside POS -->
    <rect x="198" y="72" width="78" height="112" rx="8" fill="#ffffff" stroke="#e0e8f8" />
    <rect x="206" y="82" width="62" height="8" rx="4" fill="#8a90a6" />
    <rect x="206" y="96" width="50" height="8" rx="4" fill="#8a90a6" />
    <rect x="206" y="110" width="56" height="8" rx="4" fill="#8a90a6" />
    <rect x="206" y="152" width="62" height="22" rx="6" fill="#6d5df6" />
  </g>

  <!-- Floating Receipt Floating Out -->
  <g transform="translate(390, 80) rotate(10)">
    <rect width="90" height="130" rx="8" fill="white" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.15))" />
    <circle cx="45" cy="22" r="10" fill="#71a7fd" opacity="0.3" />
    <rect x="18" y="42" width="54" height="6" rx="3" fill="#1e2235" opacity="0.6" />
    <rect x="18" y="56" width="42" height="5" rx="2" fill="#8a90a6" opacity="0.6" />
    <rect x="18" y="68" width="50" height="5" rx="2" fill="#8a90a6" opacity="0.6" />
    <line x1="14" y1="84" x2="76" y2="84" stroke="#e2e8f0" stroke-dasharray="4 4" />
    <rect x="18" y="96" width="54" height="8" rx="3" fill="#22c55e" />
  </g>
</svg>