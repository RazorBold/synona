# Reverse proxy Synona.
#
# Dipasang di VM sebagai /etc/nginx/sites-available/synona dengan symlink di
# sites-enabled/. Salinan ini ada di repo supaya konfigurasinya ikut ter-review
# dan bisa dipasang ulang kalau VM-nya diganti:
#
#   sudo cp deploy/nginx/synona.conf /etc/nginx/sites-available/synona
#   sudo ln -sfn /etc/nginx/sites-available/synona /etc/nginx/sites-enabled/synona
#   sudo nginx -t && sudo systemctl reload nginx
#
# <IP-SERVER> dan domain-lain.example di bawah adalah PLACEHOLDER — repo ini
# publik, jadi alamat server sungguhan sengaja tidak ditulis di sini. Ganti
# dengan nilai VM Anda saat memasang; nginx tidak membacanya (semuanya ada di
# dalam komentar), jadi berkas ini tetap bisa dipakai apa adanya.
#
# Kenapa port sendiri dan bukan 80: port 80 di VM ini sudah dipakai dua site
# lain (aplikasi-lain untuk server_name <IP-SERVER> dan domain-lain.example).
# Tidak ada di antaranya yang ditandai default_server, jadi menambahkan blok
# `listen 80` TANPA server_name (atau dengan server_name `_`) akan membuat
# site mana yang jadi default bergantung pada urutan pemuatan berkas — risiko
# mengambil alih trafik site lain. Karena itu akses lewat IP polos tetap di
# portnya sendiri, mengikuti pola indicars (5030) di VM yang sama.
#
# Pembagian portnya: 5028 yang DIBUKA ke LAN dan dipegang nginx, 8029 dipakai
# proses Next di belakangnya dan dikunci ke 127.0.0.1 (ecosystem.config.js).
# Jangan dibalik — 5028 adalah alamat yang dipakai orang, dan trafik wajib
# lewat nginx supaya X-Forwarded-Proto ikut terkirim. Port 5029 sengaja
# dihindari: sudah dipakai pm2 app `api` di VM ini.
#
# Blok kedua di bawah (port 80 + domain) AMAN ditambahkan berdampingan dengan
# site lain yang juga `listen 80`: nginx memilih blok berdasarkan Host header
# yang PERSIS cocok dengan `server_name`-nya duluan, baru jatuh ke
# default_server (atau blok pertama yang dimuat kalau tidak ada yang ditandai
# default) kalau tidak ada yang cocok. Domain di bawah ini tidak diklaim site
# manapun yang sudah ada, jadi tidak menyerobot trafik siapa pun — beda kasus
# dengan `listen 80` tanpa server_name di atas.

server {
    listen 5028;
    server_name _;

    # Foto produk dikirim lewat Server Action dengan batas 4 MB
    # (next.config.ts). Batas bawaan nginx 1 MB akan menolaknya dengan 413.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8029;

        proxy_http_version 1.1;

        # $http_host, bukan $host: $host membuang nomor port, sehingga
        # redirect ke /masuk yang dibangun middleware kehilangan ":8029".
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Dibaca src/server/auth.ts untuk memutuskan cookie sesi `secure`
        # atau tidak. Saat ini HTTP, jadi nilainya "http" dan cookie non-secure
        # — begitu ada TLS di depan, cookie ikut jadi secure tanpa ubah kode.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # App Router mengalirkan HTML bertahap; buffering menahan aliran itu
        # sampai respons selesai.
        proxy_buffering off;

        proxy_read_timeout 60s;
    }
}

# Akses lewat domain, TANPA TLS — sengaja hanya port 80. Nama domainnya
# PLACEHOLDER, sama seperti <IP-SERVER> di atas: ganti dengan domain Anda
# sendiri saat memasang. Cookie sesi tetap
# terkirim non-secure (lihat komentar X-Forwarded-Proto di atas): sandi dan
# token sesi mengalir polos di jaringan, bukan cuma di LAN lagi begitu domain
# ini publik. Cukup untuk demo/skripsi; pasang TLS (mis. Certbot) sebelum
# dipakai dengan data usaha sungguhan — tidak ada baris kode yang perlu
# diubah untuk itu, cookie otomatis jadi secure begitu ada TLS di depan.
server {
    listen 80;
    server_name domain-anda.example www.domain-anda.example;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8029;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
